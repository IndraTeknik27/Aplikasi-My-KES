name: my_kes
description: "My KES - KARTEKS Energy Solution Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Navigation
  go_router: ^14.6.2

  # UI helpers
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  pinput: ^5.0.0

  # Formatting & utils
  intl: ^0.20.1
  url_launcher: ^6.3.1

  # Date utilities
  table_calendar: ^3.1.3

  # PDF / Invoice viewer
  printing: ^5.13.4
  pdf: ^3.11.1

  # Midtrans Snap native SDK (Android + iOS)
  midtrans_sdk: ^1.2.0

  # FCM (push notification)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/